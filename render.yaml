services:
  - type: web
    name: ROSSTAXPROUNIVERSITY
    runtime: node
    repo: https://github.com/ceortpsc/ROSSTAXPROUNIVERSITY.git
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: RTPU_DEPLOY_ENV
        value: production
      - key: RTPU_RELEASE_CHANNEL
        value: stable
      - key: RTPU_AI_LMS_ENABLED
        value: "true"
      - key: RTPU_AI_LMS_MODE
        value: native
      - key: RTPU_AI_LECTURE_ENABLED
        value: "true"
      - key: RTPU_AI_ASSESSMENT_ENABLED
        value: "true"
      - key: RTPU_AI_TUTORING_ENABLED
        value: "true"
      - key: RTPU_AI_AGENT_MESH_ENABLED
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://rosstaxprouniversity.onrender.com
      - key: RTPU_MAINTENANCE_MODE
        value: "false"
      - key: OPS_ADMIN_KEY
        sync: false
