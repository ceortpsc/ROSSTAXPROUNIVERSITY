openapi: 3.1.0
info:
  title: RTPU Credential & Academic Records Registry API
  version: 1.0.0
  description: >-
    Read-only production registry contract for RTPU credential templates, record tables,
    views and query definitions. Persistence mutations are intentionally not exposed until
    an authorized production database is provisioned and migrations are verified.
servers:
  - url: https://rosstaxprouniversity.onrender.com
paths:
  /api/records/registry:
    get:
      summary: Get records-system registry snapshot
      responses:
        '200':
          description: Registry snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrySnapshot' }
  /api/records/templates:
    get:
      summary: List registered credential and academic-record templates
      responses:
        '200':
          description: Template and field registry
          content:
            application/json:
              schema:
                type: object
                required: [ok, templates, fields]
                properties:
                  ok: { type: boolean, const: true }
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/TemplateArtifact' }
                  fields:
                    type: array
                    items: { $ref: '#/components/schemas/TemplateFieldUsage' }
  /api/records/templates/{artifactId}:
    get:
      summary: Get one template registry entry
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, pattern: '^RTPU-DOC-[0-9]{3}$' }
      responses:
        '200':
          description: Template artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  artifact: { $ref: '#/components/schemas/TemplateArtifact' }
        '404':
          description: Template not found
  /api/records/schema:
    get:
      summary: Get table and view registry plus persistence readiness
      responses:
        '200':
          description: Data model registry
  /api/records/queries:
    get:
      summary: Get named query catalog
      responses:
        '200':
          description: Query registry
components:
  schemas:
    PersistenceState:
      type: object
      required: [configured, status, migration, target]
      properties:
        configured: { type: boolean }
        status:
          type: string
          enum: [schema-ready-not-provisioned, connection-configured-schema-application-unverified]
        migration: { type: string }
        target: { type: string }
    TemplateArtifact:
      type: object
      required: [artifactId, title, fileName, category, format, version, status, issuanceClass, sha256, fields]
      properties:
        artifactId: { type: string }
        title: { type: string }
        fileName: { type: string }
        category: { type: string }
        format: { type: string, const: docx }
        version: { type: string }
        status: { type: string, const: template-not-issued }
        issuanceClass:
          type: string
          enum: [registrar-controlled, workflow-controlled]
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        fields:
          type: array
          items: { type: string }
    TemplateFieldUsage:
      type: object
      required: [field, token, usedBy]
      properties:
        field: { type: string }
        token: { type: string }
        usedBy:
          type: array
          items: { type: string }
    RegistrySnapshot:
      type: object
      required: [ok, schemaVersion, system, persistence, artifacts, tables, views, queries, governance, observedAtUtc]
      properties:
        ok: { type: boolean, const: true }
        schemaVersion: { type: string }
        system: { type: string }
        persistence: { $ref: '#/components/schemas/PersistenceState' }
        artifacts: { type: object }
        tables:
          type: array
          items: { type: object }
        views:
          type: array
          items: { type: object }
        queries:
          type: array
          items: { type: object }
        governance: { type: object }
        observedAtUtc: { type: string, format: date-time }
