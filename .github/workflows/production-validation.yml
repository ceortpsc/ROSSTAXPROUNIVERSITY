name: RTPU Production Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run live production smoke tests after code validation
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Static validation
        run: npm run validate
      - name: Production build
        run: npm run build

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_smoke
    needs: build-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run production smoke suite
        env:
          RTPU_BASE_URL: https://rosstaxprouniversity.onrender.com
        run: node scripts/production-smoke.mjs
